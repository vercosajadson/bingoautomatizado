<title>Gerador de Bingo Didático</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Karla:wght@400;500;700&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --papel: #F3EFE3;
    --superficie: #FFFFFF;
    --tinta: #1F2A24;
    --carimbo: #2F6F5E;
    --mostarda: #C98A1F;
    --caneta: #B23A2E;
    --linha: #DCD3BE;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papel: #1B1F1C;
      --superficie: #242923;
      --tinta: #ECE7DB;
      --carimbo: #4FA88F;
      --mostarda: #E0A83F;
      --caneta: #E17B6C;
      --linha: #3A362C;
    }
  }
  :root[data-theme="dark"] {
    --papel: #1B1F1C;
    --superficie: #242923;
    --tinta: #ECE7DB;
    --carimbo: #4FA88F;
    --mostarda: #E0A83F;
    --caneta: #E17B6C;
    --linha: #3A362C;
  }
  * { box-sizing: border-box; }
  body { background: var(--papel); color: var(--tinta); font-family: 'Karla', Arial, sans-serif; margin: 0; }
  h1, h2, .passo-numero, .cartela-titulo { font-family: 'Zilla Slab', Georgia, serif; }
  .topo { padding: 1.5rem 2rem; border-bottom: 1px solid var(--linha); }
  .topo h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
  .layout { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 2rem; padding: 2rem; max-width: 1100px; margin: 0 auto; align-items: start; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .previa { position: static; order: -1; }
  }
  .passo { border: 1px solid var(--linha); padding: 1.25rem 1.5rem; margin-bottom: 1.25rem; background: var(--superficie); }
  .passo-cabecalho { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.75rem; }
  .passo-numero { font-size: 1.1rem; color: var(--carimbo); }
  .passo h2 { margin: 0; font-size: 1.05rem; }
  label { display: block; font-size: 0.85rem; margin-bottom: 0.3rem; }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 0.5rem 0.6rem; border: 1px solid var(--linha);
    background: var(--superficie); font-family: inherit; font-size: 0.95rem; color: var(--tinta);
  }
  textarea { min-height: 8rem; resize: vertical; }
  .campo { margin-bottom: 0.9rem; }
  .ajuda { font-size: 0.78rem; opacity: 0.7; margin-top: 0.25rem; }
  .paletas { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .paleta-opcao { display: flex; flex-direction: column; align-items: center; gap: 0.3rem; cursor: pointer; border: 1px solid transparent; padding: 0.3rem; background: none; font-family: inherit; color: inherit; }
  .paleta-opcao.selecionada { border-color: var(--carimbo); }
  .paleta-swatch { width: 2.2rem; height: 2.2rem; border: 1px solid var(--linha); display: block; }
  .icones-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(2.6rem, 1fr)); gap: 0.5rem; margin-top: 0.5rem; }
  .icone-opcao { border: 1px solid var(--linha); background: var(--superficie); padding: 0.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icone-opcao.selecionado { border-color: var(--carimbo); }
  .icone-opcao svg { width: 1.4rem; height: 1.4rem; }
  .previa { position: sticky; top: 1.5rem; border: 1px solid var(--linha); background: var(--superficie); padding: 1.5rem; }
  .cartela {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem;
    border: 1px solid var(--tema-primaria, var(--carimbo));
    background: var(--tema-fundo, var(--superficie));
    padding: 1rem; margin-bottom: 1rem;
    text-align: center; font-family: var(--tema-fonte, 'Karla, Arial, sans-serif');
    position: relative;
  }
  .cartela-titulo { grid-column: 1 / -1; font-size: 1.1rem; color: var(--tema-primaria, var(--carimbo)); margin-bottom: 0.4rem; position: relative; z-index: 1; }
  .cartela-marca-dagua { position: absolute; inset: 0.6rem; z-index: 0; display: none; align-items: center; justify-content: center; opacity: 0.15; pointer-events: none; }
  .cartela-marca-dagua svg, .cartela-marca-dagua img { width: 60%; height: 60%; object-fit: contain; }
  .cartela-celula { border: 1px solid var(--linha); padding: 0.75rem 0.3rem; font-size: 1.05rem; color: var(--tema-texto, var(--tinta)); overflow-wrap: anywhere; position: relative; z-index: 1; }
  .estimativa { font-size: 0.9rem; margin-bottom: 0.75rem; }
  .estimativa strong { color: var(--carimbo); }
  .avisos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.4rem; }
  .aviso { font-size: 0.85rem; padding: 0.5rem 0.7rem; border-left: 3px solid var(--caneta); background: color-mix(in srgb, var(--caneta) 12%, var(--superficie)); }
  .aviso.aviso-ok { border-left-color: var(--carimbo); background: color-mix(in srgb, var(--carimbo) 12%, var(--superficie)); }
  .aviso.aviso-atencao { border-left-color: var(--mostarda); background: color-mix(in srgb, var(--mostarda) 12%, var(--superficie)); }
  .imagem-preview { max-width: 4rem; margin-top: 0.5rem; border: 1px solid var(--linha); }
  .botao-primario {
    display: block; width: 100%; margin-top: 0.75rem; padding: 0.7rem 1.2rem;
    background: var(--carimbo); color: var(--superficie); border: none;
    font-family: inherit; font-size: 0.95rem; cursor: pointer;
  }
  .botao-primario:disabled { opacity: 0.5; cursor: not-allowed; }
  .botao-primario:hover:not(:disabled) { background: color-mix(in srgb, var(--carimbo) 85%, black); }
</style>

<header class="topo">
  <h1>Gerador de Bingo Didático</h1>
</header>

<main class="layout">
  <form class="formulario" id="formulario">
    <section class="passo">
      <div class="passo-cabecalho"><span class="passo-numero">1</span><h2>Tema</h2></div>
      <div class="campo">
        <label for="campo-tema">Nome do jogo</label>
        <input type="text" id="campo-tema" placeholder="Ex.: Bingo da Porcentagem">
      </div>
    </section>

    <section class="passo">
      <div class="passo-cabecalho"><span class="passo-numero">2</span><h2>Perguntas</h2></div>
      <div class="campo">
        <label for="campo-perguntas">Perguntas e respostas</label>
        <textarea id="campo-perguntas" placeholder="Uma por linha, no formato: pergunta | resposta&#10;Ex.: 10% de 20 | 2"></textarea>
        <p class="ajuda">Uma pergunta por linha, separando pergunta e resposta com "|". <span id="contagem-perguntas">0 perguntas</span></p>
      </div>
    </section>

    <section class="passo">
      <div class="passo-cabecalho"><span class="passo-numero">3</span><h2>Cartelas</h2></div>
      <div class="campo">
        <label for="campo-cartelas">Número de cartelas</label>
        <input type="number" id="campo-cartelas" min="1" max="200" value="40">
      </div>
      <div class="campo">
        <label for="campo-respostas-cartela">Respostas por cartela</label>
        <input type="number" id="campo-respostas-cartela" min="1" max="100" value="9">
      </div>
    </section>

    <section class="passo">
      <div class="passo-cabecalho"><span class="passo-numero">4</span><h2>Visual</h2></div>
      <div class="campo">
        <label>Paleta de cores</label>
        <div class="paletas" id="paletas"></div>
      </div>
      <div class="campo">
        <label for="campo-fonte">Tipografia da cartela</label>
        <select id="campo-fonte">
          <option value="Karla, Arial, sans-serif">Karla (sans)</option>
          <option value="Zilla Slab, Georgia, serif">Zilla Slab (serifada)</option>
        </select>
      </div>
      <div class="campo">
        <label>Ícone do tema</label>
        <div class="icones-grade" id="icones-grade"></div>
      </div>
      <div class="campo">
        <label for="campo-imagem">Ou envie sua própria imagem</label>
        <input type="file" id="campo-imagem" accept="image/*">
        <img class="imagem-preview" id="imagem-preview" alt="Pré-visualização da imagem enviada" hidden>
      </div>
    </section>
  </form>

  <aside class="previa">
    <div class="cartela" id="cartela-preview">
      <div class="cartela-marca-dagua" id="cartela-marca-dagua"></div>
      <div class="cartela-titulo" id="cartela-titulo">Bingo</div>
    </div>
    <div class="estimativa" id="estimativa" aria-live="polite">Adicione perguntas para ver a estimativa de duração do jogo.</div>
    <ul class="avisos" id="avisos" aria-live="polite"></ul>
    <button type="button" id="botao-gerar" class="botao-primario" disabled>Gerar bingo</button>
    <p class="ajuda">O PDF inclui as cartelas e as fichas de sorteio (com e sem gabarito).</p>
  </aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module">
  // ===== INÍCIO: motor inlined (Plano 1 + Plano 2) =====

  // --- src/gameMath.mjs ---
  function estimateSingleCardDraws(bankSize, cellsPerCard) {
    if (bankSize <= 0 || cellsPerCard <= 0) {
      const error = new RangeError('bankSize and cellsPerCard must be positive');
      error.code = 'invalid-arguments';
      throw error;
    }
    return (cellsPerCard * (bankSize + 1)) / (cellsPerCard + 1);
  }

  const DEFAULT_CELLS_PER_CARD = 9;
  const DEFAULT_CARD_COUNT = 40;

  function simulateGameLength(bankSize, cellsPerCard, cardCount, options = {}) {
    const { trials = 400, random = Math.random } = options;
    if (cellsPerCard > bankSize) {
      const error = new RangeError('cellsPerCard cannot exceed bankSize');
      error.code = 'cells-exceed-bank-size';
      throw error;
    }
    if (trials <= 0) {
      const error = new RangeError('trials must be a positive number');
      error.code = 'invalid-trials';
      throw error;
    }

    const pool = Array.from({ length: bankSize }, (_, i) => i);
    const gameLengths = [];

    for (let t = 0; t < trials; t++) {
      const drawOrder = shuffle(pool, random);
      const position = new Map();
      drawOrder.forEach((item, idx) => position.set(item, idx));

      const seenCards = new Set();
      const cards = [];
      let attempts = 0;
      while (cards.length < cardCount && attempts < cardCount * 200) {
        attempts++;
        const card = shuffle(pool, random).slice(0, cellsPerCard);
        const key = card.slice().sort((a, b) => a - b).join(',');
        if (!seenCards.has(key)) {
          seenCards.add(key);
          cards.push(card);
        }
      }

      const completions = cards.map(
        (card) => Math.max(...card.map((item) => position.get(item))) + 1
      );
      gameLengths.push(Math.min(...completions));
    }

    gameLengths.sort((a, b) => a - b);
    const n = gameLengths.length;
    const meanDraws = gameLengths.reduce((sum, v) => sum + v, 0) / n;
    const percentOfBankUsed = (meanDraws / bankSize) * 100;

    return {
      meanDraws,
      medianDraws: percentile(gameLengths, 0.5),
      p10Draws: percentile(gameLengths, 0.1),
      p90Draws: percentile(gameLengths, 0.9),
      percentOfBankUsed,
    };
  }

  function checkBankSizeRatio({ bankSize, cellsPerCard, cardCount, percentOfBankUsed }) {
    const issues = [];

    if (bankSize <= cellsPerCard) {
      issues.push({
        level: 'error',
        code: 'bank-too-small',
        message: `O banco tem ${bankSize} pergunta(s), mas cada cartela precisa de ${cellsPerCard} respostas. Adicione mais perguntas ou reduza respostas por cartela.`,
      });
      return issues;
    }

    if (bankSize < 1.5 * cellsPerCard) {
      issues.push({
        level: 'warning',
        code: 'bank-small',
        message: `Com apenas ${bankSize} perguntas para ${cellsPerCard} respostas por cartela, o jogo tende a ficar curto e pouco competitivo. Considere adicionar mais perguntas.`,
      });
    }

    if (typeof percentOfBankUsed === 'number' && percentOfBankUsed < 40) {
      issues.push({
        level: 'warning',
        code: 'bank-large',
        message: `Em média, apenas ${percentOfBankUsed.toFixed(0)}% do banco será sorteado antes de alguém vencer. Boa parte das perguntas pode nunca ser usada nesta partida.`,
      });
    }

    if (typeof cardCount === 'number' && !combinationsAtLeast(bankSize, cellsPerCard, cardCount * 10)) {
      issues.push({
        level: 'warning',
        code: 'combinations-tight',
        message: `Com ${bankSize} perguntas e ${cellsPerCard} respostas por cartela, há poucas combinações possíveis para ${cardCount} cartelas únicas. Considere adicionar mais perguntas ou reduzir o número de cartelas.`,
      });
    }

    if (issues.length === 0) {
      issues.push({ level: 'ok', code: 'ok', message: 'Proporção de perguntas por cartela está balanceada.' });
    }

    return issues;
  }

  function shuffle(array, random) {
    const copy = array.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function percentile(sortedArray, p) {
    const idx = Math.min(sortedArray.length - 1, Math.floor(p * sortedArray.length));
    return sortedArray[idx];
  }

  // Returns true if C(n, k) >= threshold, computed incrementally to avoid
  // integer overflow on large n/k (we only ever need to know if it clears
  // the threshold, not its exact value).
  function combinationsAtLeast(n, k, threshold) {
    if (k < 0 || k > n) return false;
    if (k === 0 || k === n) return threshold <= 1;
    let result = 1;
    for (let i = 0; i < k; i++) {
      result = (result * (n - i)) / (i + 1);
      if (result >= threshold) return true;
    }
    return result >= threshold;
  }

  // --- src/cardGenerator.mjs (shuffle já definida acima) ---
  function findDuplicateAnswers(bank) {
    const seen = new Map();
    for (const entry of bank) {
      const key = normalizeAnswer(entry.answer);
      if (!seen.has(key)) seen.set(key, []);
      seen.get(key).push(entry);
    }
    return [...seen.values()].filter((group) => group.length > 1);
  }

  function generateUniqueCards(bank, cellsPerCard, cardCount, options = {}) {
    const { random = Math.random, maxAttempts = cardCount * 500 } = options;

    if (cellsPerCard > bank.length) {
      const error = new RangeError(
        `Não é possível montar cartelas de ${cellsPerCard} respostas com um banco de apenas ${bank.length} pergunta(s).`
      );
      error.code = 'cells-exceed-bank';
      throw error;
    }

    const seenKeys = new Set();
    const cards = [];
    let attempts = 0;

    while (cards.length < cardCount) {
      if (attempts >= maxAttempts) {
        const error = new Error(
          `Não foi possível gerar ${cardCount} cartelas únicas com ${cellsPerCard} respostas cada a partir de ${bank.length} perguntas. Aumente o banco de perguntas ou reduza o número de cartelas.`
        );
        error.code = 'insufficient-combinations';
        throw error;
      }
      attempts++;

      const sampleIndexes = shuffle(
        Array.from({ length: bank.length }, (_, i) => i),
        random
      ).slice(0, cellsPerCard);

      const cardEntries = sampleIndexes.map((i) => ({ ...bank[i] }));
      const key = cardEntries
        .map((entry) => normalizeAnswer(entry.answer))
        .sort()
        .join(',');
      if (seenKeys.has(key)) continue;

      seenKeys.add(key);
      cards.push(shuffle(cardEntries, random));
    }

    return cards;
  }

  function normalizeAnswer(answer) {
    return String(answer).normalize('NFC').trim().replace(/\s+/g, ' ').toLowerCase();
  }

  // --- src/ticketGenerator.mjs ---
  function generateTickets(bank) {
    const withAnswer = bank.map((entry) => ({ question: entry.question, answer: entry.answer }));
    const withoutAnswer = bank.map((entry) => ({ question: entry.question }));
    return { withAnswer, withoutAnswer };
  }

  // --- src/theme.mjs ---
  const PALETTE_PRESETS = [
    { id: 'classico', name: 'Clássico', primary: '#2F6F5E', accent: '#C98A1F', background: '#FFFFFF', text: '#1F2A24' },
    { id: 'alegre', name: 'Alegre', primary: '#D6486B', accent: '#3FA7A0', background: '#FFFFFF', text: '#241B2F' },
    { id: 'oceano', name: 'Oceano', primary: '#1D5C8A', accent: '#F2A65A', background: '#FFFFFF', text: '#132433' },
    { id: 'floresta', name: 'Floresta', primary: '#3B6B35', accent: '#E4B73B', background: '#FFFFFF', text: '#1B2A17' },
  ];

  function isValidHexColor(value) {
    return typeof value === 'string' && /^#[0-9a-fA-F]{6}$/.test(value);
  }

  function resolveTheme({ paletteId, customColors = {}, fontFamily } = {}) {
    const preset = PALETTE_PRESETS.find((p) => p.id === paletteId) ?? PALETTE_PRESETS[0];
    const colors = {
      primary: preset.primary,
      accent: preset.accent,
      background: preset.background,
      text: preset.text,
    };

    for (const key of Object.keys(colors)) {
      const custom = customColors[key];
      if (custom === undefined) continue;
      if (!isValidHexColor(custom)) {
        const error = new Error(`Cor inválida para "${key}": "${custom}". Use um hexadecimal no formato #RRGGBB.`);
        error.code = 'invalid-color';
        throw error;
      }
      colors[key] = custom;
    }

    return {
      ...colors,
      fontFamily: fontFamily || 'Karla, sans-serif',
    };
  }

  function tintSvg(svgMarkup, hexColor) {
    if (!isValidHexColor(hexColor)) {
      const error = new Error(`Cor inválida para tingir o ícone: "${hexColor}".`);
      error.code = 'invalid-color';
      throw error;
    }
    return svgMarkup.replace(/(fill|stroke)="#[0-9a-fA-F]{3,6}"/g, `$1="${hexColor}"`);
  }

  // --- src/icons.mjs ---
  const ICON_CATEGORIES = {
    matematica: [
      {
        id: 'matematica-percentual',
        label: 'Percentual',
        svg: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M6 18L18 6" stroke="#000000" stroke-width="2" stroke-linecap="round"/><circle cx="7" cy="7" r="2.5" fill="#000000"/><circle cx="17" cy="17" r="2.5" fill="#000000"/></svg>',
      },

      },
      {
        id: 'geografia-mapa',

      },
    ],
    ciencias: [
      {
        id: 'ciencias-frasco',

        svg: '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M10 3h4v6l5 9a2 2 0 01-1.8 3H6.8A2 2 0 015 18l5-9z" fill="none" stroke="#000000" stroke-width="2" stroke-linejoin="round"/></svg>',
      },
      {

  };

  // --- src/questionBank.mjs ---
  function parseQuestionBank(text) {
    const lines = text
      .split('\n')
      .map((line) => line.trim())
      .filter((line) => line.length > 0);

    const entries = [];
    let ignored = 0;
    for (const line of lines) {
      const [question, answer] = line.split('|').map((part) => (part ?? '').trim());
      if (question && answer) {
        entries.push({ question, answer });
      } else {
        ignored++;
      }
    }
    return { entries, ignored };
  }

  // --- src/pdfLayout.mjs ---
  const PAGE_WIDTH_PT = 822;
  const PAGE_HEIGHT_PT = 595.5;

  const CARD_WIDTH_PT = 392.3;
  const CARD_HEIGHT_PT = 442.9;
  const CARD_MARGIN_LEFT_PT = 15.2;
  const CARD_MARGIN_TOP_PT = 51.9;
  const CARD_GAP_PT = 3.4;
  const CARDS_PER_PAGE = 2;

  const CARD_TITLE_HEIGHT_PT = 75;
  const CARD_TITLE_MARGIN_TOP_PT = 15.7;

  const CARD_GRID_SIZE_PT = 319.2;
  const CARD_GRID_MARGIN_TOP_PT = 78.0;
  const CARD_GRID_MARGIN_LEFT_PT = 36.6;

  const TICKET_WIDTH_PT = 336.7;
  const TICKET_HEIGHT_PT = 181.1;
  const TICKET_MARGIN_LEFT_PT = 15.3;
  const TICKET_MARGIN_TOP_PT = 5.9;
  const TICKET_COL_GAP_PT = 5.3;
  const TICKET_ROW_GAP_PT = 6.9;
  const TICKETS_PER_ROW = 2;
  const TICKETS_PER_COL = 3;
  const TICKETS_PER_PAGE = TICKETS_PER_ROW * TICKETS_PER_COL;

  const TICKET_CONTENT_SIZE_PT = 129.3;

  function gridDimensions(cellsPerCard) {
    const columns = Math.ceil(Math.sqrt(cellsPerCard));
    const rows = Math.ceil(cellsPerCard / columns);
    return { columns, rows };
  }

  function cardPositionsForPage() {
    return [
      { x: CARD_MARGIN_LEFT_PT, y: CARD_MARGIN_TOP_PT },
      { x: CARD_MARGIN_LEFT_PT + CARD_WIDTH_PT + CARD_GAP_PT, y: CARD_MARGIN_TOP_PT },
    ];
  }

  function cardSlot(index) {
    const page = Math.floor(index / CARDS_PER_PAGE);
    const slotOnPage = index % CARDS_PER_PAGE;
    const origin = cardPositionsForPage()[slotOnPage];
    return { page, x: origin.x, y: origin.y };
  }

  function cardCellRect(cellIndex, cellsPerCard) {
    const { columns, rows } = gridDimensions(cellsPerCard);
    const cellWidth = CARD_GRID_SIZE_PT / columns;
    const cellHeight = CARD_GRID_SIZE_PT / rows;
    const col = cellIndex % columns;
    const row = Math.floor(cellIndex / columns);
    return {
      x: CARD_GRID_MARGIN_LEFT_PT + col * cellWidth,
      y: CARD_GRID_MARGIN_TOP_PT + row * cellHeight,
      width: cellWidth,
      height: cellHeight,
    };
  }

  function ticketPositionsForPage() {
    const positions = [];
    for (let row = 0; row < TICKETS_PER_COL; row++) {
      for (let col = 0; col < TICKETS_PER_ROW; col++) {
        positions.push({
          x: TICKET_MARGIN_LEFT_PT + col * (TICKET_WIDTH_PT + TICKET_COL_GAP_PT),
          y: TICKET_MARGIN_TOP_PT + row * (TICKET_HEIGHT_PT + TICKET_ROW_GAP_PT),
        });
      }
    }
    return positions;
  }

  function ticketSlot(index) {
    const page = Math.floor(index / TICKETS_PER_PAGE);
    const slotOnPage = index % TICKETS_PER_PAGE;
    const origin = ticketPositionsForPage()[slotOnPage];
    return { page, x: origin.x, y: origin.y };
  }

  function paginate(itemCount, itemsPerPage) {
    return Math.ceil(itemCount / itemsPerPage);
  }

  // ===== FIM: motor inlined =====

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  function debounce(fn, delay) {
    let handle;
    const debounced = (...args) => {
      clearTimeout(handle);
      handle = setTimeout(() => fn(...args), delay);
    };
    debounced.cancel = () => clearTimeout(handle);
    return debounced;
  }

  const els = {
    tema: document.getElementById('campo-tema'),
    perguntas: document.getElementById('campo-perguntas'),
    contagem: document.getElementById('contagem-perguntas'),
    cartelas: document.getElementById('campo-cartelas'),
    respostasCartela: document.getElementById('campo-respostas-cartela'),
    fonte: document.getElementById('campo-fonte'),
    imagem: document.getElementById('campo-imagem'),
    imagemPreview: document.getElementById('imagem-preview'),
    paletas: document.getElementById('paletas'),
    iconesGrade: document.getElementById('icones-grade'),
    cartelaPreview: document.getElementById('cartela-preview'),
    cartelaTitulo: document.getElementById('cartela-titulo'),
    cartelaMarcaDagua: document.getElementById('cartela-marca-dagua'),
    estimativa: document.getElementById('estimativa'),
    avisos: document.getElementById('avisos'),
    botaoGerar: document.getElementById('botao-gerar'),
  };

  let paletaSelecionadaId = PALETTE_PRESETS[0].id;
  let iconeSelecionadoId = null;
  let imagemPersonalizadaUrl = null;
  let cachedCardKey = null;
  let cachedCard = null;

  function renderPalettes() {
    els.paletas.innerHTML = '';
    for (const preset of PALETTE_PRESETS) {
      const opcao = document.createElement('button');
      opcao.type = 'button';
      const selecionada = preset.id === paletaSelecionadaId;
      opcao.className = 'paleta-opcao' + (selecionada ? ' selecionada' : '');
      opcao.setAttribute('aria-pressed', String(selecionada));
      opcao.innerHTML = `<span class="paleta-swatch" style="background:${preset.primary}"></span><span>${preset.name}</span>`;
      opcao.addEventListener('click', () => {
        paletaSelecionadaId = preset.id;
        renderPalettes();
        scheduleUpdate();
      });
      els.paletas.appendChild(opcao);
    }
  }

  function findIconById(id) {
    for (const categoria of Object.values(ICON_CATEGORIES)) {
      const found = categoria.find((icone) => icone.id === id);
      if (found) return found;
    }
    return null;
  }

  function renderIcons() {
    els.iconesGrade.innerHTML = '';
    for (const categoria of Object.values(ICON_CATEGORIES)) {
      for (const icone of categoria) {
        const botao = document.createElement('button');
        botao.type = 'button';
        const selecionado = icone.id === iconeSelecionadoId;
        botao.className = 'icone-opcao' + (selecionado ? ' selecionado' : '');
        botao.title = icone.label;
        botao.setAttribute('aria-label', icone.label);
        botao.setAttribute('aria-pressed', String(selecionado));
        botao.innerHTML = icone.svg;
        botao.addEventListener('click', () => {
          iconeSelecionadoId = iconeSelecionadoId === icone.id ? null : icone.id;
          renderIcons();
          scheduleUpdate();
        });
        els.iconesGrade.appendChild(botao);
      }
    }
  }

  function renderWarnings(issues) {
    els.avisos.innerHTML = '';
    for (const issue of issues) {
      const item = document.createElement('li');
      let className = 'aviso';
      if (issue.level === 'ok') className += ' aviso-ok';
      else if (issue.level === 'warning') className += ' aviso-atencao';
      item.className = className;
      item.textContent = issue.message;
      els.avisos.appendChild(item);
    }
  }

  function getStablePreviewCard(bank, cellsPerCard) {
    const key = cellsPerCard + '|' + bank.map((entry) => entry.question + '::' + entry.answer).join('|');
    if (key !== cachedCardKey) {
      cachedCardKey = key;
      try {
        cachedCard = generateUniqueCards(bank, cellsPerCard, 1)[0];
      } catch {
        cachedCard = null;
      }
    }
    return cachedCard;
  }

  function renderCardWatermark(theme) {
    const container = els.cartelaMarcaDagua;
    container.innerHTML = '';
    if (imagemPersonalizadaUrl) {
      const img = document.createElement('img');
      img.src = imagemPersonalizadaUrl;
      img.alt = '';
      container.appendChild(img);
      container.style.display = 'flex';
      return;
    }
    const iconeSelecionado = iconeSelecionadoId ? findIconById(iconeSelecionadoId) : null;
    if (iconeSelecionado) {
      const tintado = tintSvg(iconeSelecionado.svg, theme.primary);
      container.innerHTML = tintado;
      const svgEl = container.querySelector('svg');
      if (svgEl) svgEl.setAttribute('aria-hidden', 'true');
      container.style.display = 'flex';
      return;
    }
    container.style.display = 'none';
  }

  function renderPreviewCard(bank, cellsPerCard) {
    els.cartelaPreview.querySelectorAll('.cartela-celula').forEach((cell) => cell.remove());
    if (bank.length === 0 || bank.length <= cellsPerCard) return;

    const card = getStablePreviewCard(bank, cellsPerCard);
    if (!card) return;

    for (const entry of card) {
      const celula = document.createElement('div');
      celula.className = 'cartela-celula';
      celula.textContent = entry.answer;
      els.cartelaPreview.appendChild(celula);
    }
  }

  function updateCheap() {
    const { entries: bank, ignored } = parseQuestionBank(els.perguntas.value);
    els.contagem.textContent =
      `${bank.length} pergunta${bank.length === 1 ? '' : 's'}` +
      (ignored > 0 ? ` (${ignored} linha${ignored === 1 ? '' : 's'} ignorada${ignored === 1 ? '' : 's'} sem "|")` : '');

    const cellsPerCard = clamp(Number(els.respostasCartela.value) || DEFAULT_CELLS_PER_CARD, 1, 100);
    const cardCount = clamp(Number(els.cartelas.value) || DEFAULT_CARD_COUNT, 1, 200);

    const theme = resolveTheme({ paletteId: paletaSelecionadaId, fontFamily: els.fonte.value });
    renderCardWatermark(theme);

    els.cartelaTitulo.textContent = els.tema.value.trim() || 'Bingo';
    els.cartelaPreview.style.setProperty('--tema-primaria', theme.primary);
    els.cartelaPreview.style.setProperty('--tema-fundo', theme.background);
    els.cartelaPreview.style.setProperty('--tema-texto', theme.text);
    els.cartelaPreview.style.setProperty('--tema-fonte', theme.fontFamily);

    const duplicates = findDuplicateAnswers(bank);
    let issues = [];
    if (duplicates.length > 0) {
      issues = duplicates.map((group) => ({
        level: 'error',
        message: `A resposta "${group[0].answer}" se repete nas perguntas: ${group.map((entry) => `"${entry.question}"`).join(', ')} — cada resposta precisa ser única.`,
      }));
    } else if (bank.length > 0) {
      issues = checkBankSizeRatio({ bankSize: bank.length, cellsPerCard, cardCount });
    }
    renderWarnings(issues);
    els.cartelaPreview.style.gridTemplateColumns = `repeat(${gridDimensions(cellsPerCard).columns}, 1fr)`;
    renderPreviewCard(bank, cellsPerCard);

    els.botaoGerar.disabled = !canGenerate(bank, cellsPerCard, duplicates.length > 0);

    return { bank, cellsPerCard, cardCount, hasDuplicates: duplicates.length > 0 };
  }

  function canGenerate(bank, cellsPerCard, hasDuplicates) {
    return !hasDuplicates && bank.length > 0 && bank.length > cellsPerCard;
  }

  const scheduleAccurateEstimate = debounce((bank, cellsPerCard, cardCount) => {
    if (bank.length <= cellsPerCard) return;
    const { percentOfBankUsed, meanDraws } = simulateGameLength(bank.length, cellsPerCard, cardCount, { trials: 200 });
    els.estimativa.innerHTML = `Com ${cardCount} cartelas em jogo: <strong>~${meanDraws.toFixed(0)} sorteios</strong> até o 1º vencedor, usando ~${percentOfBankUsed.toFixed(0)}% do banco.`;
    renderWarnings(checkBankSizeRatio({ bankSize: bank.length, cellsPerCard, cardCount, percentOfBankUsed }));
  }, 300);

  function scheduleUpdate() {
    const { bank, cellsPerCard, cardCount, hasDuplicates } = updateCheap();
    if (!hasDuplicates && bank.length > cellsPerCard) {
      scheduleAccurateEstimate(bank, cellsPerCard, cardCount);
      return;
    }
    scheduleAccurateEstimate.cancel();
    if (bank.length === 0) {
      els.estimativa.textContent = 'Adicione perguntas para ver a estimativa de duração do jogo.';
    } else if (hasDuplicates) {
      els.estimativa.textContent = 'Corrija as respostas repetidas para ver a estimativa de duração do jogo.';
    } else {
      els.estimativa.textContent = 'Adicione mais perguntas para ver a estimativa de duração do jogo.';
    }
  }

  function hexToRgb(hex) {
    const value = hex.replace('#', '');
    return {
      r: parseInt(value.slice(0, 2), 16),
      g: parseInt(value.slice(2, 4), 16),
      b: parseInt(value.slice(4, 6), 16),
    };
  }

  function newPdfPage(doc) {
    doc.addPage([PAGE_WIDTH_PT, PAGE_HEIGHT_PT], 'landscape');
  }

  function jsPdfFontForTheme(fontFamily) {
    return fontFamily && fontFamily.startsWith('Zilla') ? 'times' : 'helvetica';
  }

  function drawWatermarkImage(doc, imageDataUrl, centerX, centerY, size, opacity) {
    if (!imageDataUrl) return;
    doc.saveGraphicsState();
    doc.setGState(new doc.GState({ opacity }));
    doc.addImage(imageDataUrl, 'PNG', centerX - size / 2, centerY - size / 2, size, size);
    doc.restoreGraphicsState();
  }

  function drawFittedText(doc, text, centerX, centerY, maxWidth, maxHeight, maxFontSize, minFontSize) {
    const value = String(text);
    let fontSize = maxFontSize;
    let lines = [value];
    while (fontSize > minFontSize) {
      doc.setFontSize(fontSize);
      lines = doc.splitTextToSize(value, maxWidth);
      const lineHeight = fontSize * 1.15;
      if (lines.length * lineHeight <= maxHeight) break;
      fontSize -= 1;
    }
    doc.setFontSize(fontSize);
    const lineHeight = fontSize * 1.15;
    const totalHeight = lines.length * lineHeight;
    const firstLineY = centerY - totalHeight / 2 + lineHeight / 2;
    lines.forEach((line, i) => {
      doc.text(line, centerX, firstLineY + i * lineHeight, { align: 'center', baseline: 'middle' });
    });
  }

  function renderCardPdf(doc, card, tema, theme, x, y, watermarkImageDataUrl) {
    const primary = hexToRgb(theme.primary);
    const background = hexToRgb(theme.background);
    const text = hexToRgb(theme.text);
    const fonte = jsPdfFontForTheme(theme.fontFamily);

    doc.setDrawColor(primary.r, primary.g, primary.b);
    doc.setFillColor(background.r, background.g, background.b);
    doc.rect(x, y, CARD_WIDTH_PT, CARD_HEIGHT_PT, 'FD');

    drawWatermarkImage(
      doc,
      watermarkImageDataUrl,
      x + CARD_GRID_MARGIN_LEFT_PT + CARD_GRID_SIZE_PT / 2,
      y + CARD_GRID_MARGIN_TOP_PT + CARD_GRID_SIZE_PT / 2,
      CARD_GRID_SIZE_PT * 0.6,
      0.15
    );

    doc.setFont(fonte);
    doc.setTextColor(primary.r, primary.g, primary.b);
    doc.setFontSize(20);
    doc.text(tema, x + CARD_WIDTH_PT / 2, y + CARD_TITLE_MARGIN_TOP_PT + CARD_TITLE_HEIGHT_PT / 2, {
      align: 'center',
      baseline: 'middle',
      maxWidth: CARD_WIDTH_PT - 24,
    });

    doc.setFont('helvetica');
    doc.setDrawColor(200, 200, 200);
    doc.setTextColor(text.r, text.g, text.b);
    for (let i = 0; i < card.length; i++) {
      const cell = cardCellRect(i, card.length);
      doc.rect(x + cell.x, y + cell.y, cell.width, cell.height, 'S');
      drawFittedText(
        doc,
        card[i].answer,
        x + cell.x + cell.width / 2,
        y + cell.y + cell.height / 2,
        cell.width - 8,
        cell.height - 8,
        16,
        8
      );
    }
  }

  function renderTicketPdf(doc, entry, comGabarito, x, y, watermarkImageDataUrl) {
    doc.setDrawColor(150, 150, 150);
    doc.rect(x, y, TICKET_WIDTH_PT, TICKET_HEIGHT_PT, 'S');

    drawWatermarkImage(
      doc,
      watermarkImageDataUrl,
      x + TICKET_WIDTH_PT / 2,
      y + TICKET_HEIGHT_PT / 2,
      Math.min(TICKET_WIDTH_PT, TICKET_HEIGHT_PT) * 0.6,
      0.12
    );

    if (comGabarito) {
      doc.setFont('helvetica');
      doc.setFontSize(9);
      doc.setTextColor(120, 120, 120);
      doc.text(`${entry.question} = ${entry.answer}`, x + TICKET_WIDTH_PT / 2, y + 16, {
        align: 'center',
        maxWidth: TICKET_WIDTH_PT - 24,
      });
    }

    doc.setFont('helvetica');
    doc.setTextColor(30, 30, 30);
    const areaY = comGabarito ? y + TICKET_HEIGHT_PT / 2 + 10 : y + TICKET_HEIGHT_PT / 2;
    const areaHeight = comGabarito ? TICKET_HEIGHT_PT - 55 : TICKET_HEIGHT_PT - 30;
    drawFittedText(doc, entry.question, x + TICKET_WIDTH_PT / 2, areaY, TICKET_WIDTH_PT - 40, areaHeight, 14, 8);
  }

  function buildBingoPdf({ tema, cards, tickets, theme, watermarkImageDataUrl }) {
    if (!window.jspdf) {
      throw new Error('A biblioteca de geração de PDF não carregou. Verifique sua conexão e recarregue a página.');
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [PAGE_WIDTH_PT, PAGE_HEIGHT_PT] });

    const cardSlots = cardPositionsForPage();
    cards.forEach((card, i) => {
      const slotOnPage = i % CARDS_PER_PAGE;
      if (i > 0 && slotOnPage === 0) newPdfPage(doc);
      renderCardPdf(doc, card, tema, theme, cardSlots[slotOnPage].x, cardSlots[slotOnPage].y, watermarkImageDataUrl);
    });

    const ticketSlots = ticketPositionsForPage();
    tickets.withAnswer.forEach((entry, i) => {
      const slotOnPage = i % TICKETS_PER_PAGE;
      if (slotOnPage === 0) newPdfPage(doc);
      renderTicketPdf(doc, entry, true, ticketSlots[slotOnPage].x, ticketSlots[slotOnPage].y, watermarkImageDataUrl);
    });

    tickets.withoutAnswer.forEach((entry, i) => {
      const slotOnPage = i % TICKETS_PER_PAGE;
      if (slotOnPage === 0) newPdfPage(doc);
      renderTicketPdf(doc, entry, false, ticketSlots[slotOnPage].x, ticketSlots[slotOnPage].y, watermarkImageDataUrl);
    });

    return doc;
  }

  els.imagem.addEventListener('change', () => {
    const file = els.imagem.files[0];
    if (imagemPersonalizadaUrl) URL.revokeObjectURL(imagemPersonalizadaUrl);
    imagemPersonalizadaUrl = file ? URL.createObjectURL(file) : null;
    if (imagemPersonalizadaUrl) {
      els.imagemPreview.src = imagemPersonalizadaUrl;
      els.imagemPreview.hidden = false;
    } else {
      els.imagemPreview.hidden = true;
    }
    scheduleUpdate();
  });

  document.getElementById('formulario').addEventListener('submit', (event) => event.preventDefault());

  for (const el of [els.tema, els.perguntas, els.cartelas, els.respostasCartela, els.fonte]) {
    el.addEventListener('input', scheduleUpdate);
  }

  function loadImageAsDataUrl(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth || 64;
        canvas.height = img.naturalHeight || 64;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = () => reject(new Error('Não foi possível carregar a imagem do tema.'));
      img.src = src;
    });
  }

  function svgToDataUrl(svgMarkup) {
    return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svgMarkup)}`;
  }

  async function resolveWatermarkImageDataUrl(theme) {
    if (imagemPersonalizadaUrl) {
      return loadImageAsDataUrl(imagemPersonalizadaUrl);
    }
    const iconeSelecionado = iconeSelecionadoId ? findIconById(iconeSelecionadoId) : null;
    if (iconeSelecionado) {
      const tintado = tintSvg(iconeSelecionado.svg, theme.primary);
      return loadImageAsDataUrl(svgToDataUrl(tintado));
    }
    return null;
  }

  els.botaoGerar.addEventListener('click', async () => {
    const { bank, cellsPerCard, cardCount, hasDuplicates } = updateCheap();
    if (!canGenerate(bank, cellsPerCard, hasDuplicates)) return;

    els.botaoGerar.disabled = true;
    const textoOriginal = els.botaoGerar.textContent;
    els.botaoGerar.textContent = 'Gerando...';
    await new Promise((resolve) => requestAnimationFrame(resolve));

    try {
      const theme = resolveTheme({ paletteId: paletaSelecionadaId, fontFamily: els.fonte.value });
      const watermarkImageDataUrl = await resolveWatermarkImageDataUrl(theme);
      const cards = generateUniqueCards(bank, cellsPerCard, cardCount);
      const tickets = generateTickets(bank);
      const tema = els.tema.value.trim() || 'Bingo';
      const doc = buildBingoPdf({ tema, cards, tickets, theme, watermarkImageDataUrl });
      const blob = doc.output('blob');

      const downloads = await claude.use('downloads');
      if (!downloads) {
        renderWarnings([{ level: 'error', message: 'Não foi possível baixar o PDF neste ambiente.' }]);
      } else {
        const nomeArquivoBase = tema
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/(^-|-$)/g, '');
        const nomeArquivo = nomeArquivoBase || 'bingo';
        try {
          await downloads.save({ filename: `${nomeArquivo}.pdf`, data: blob });
        } catch (saveError) {
          if (saveError && saveError.code !== 'declined') {
            const mensagem =
              saveError && saveError.code === 'rate_limited'
                ? 'Muitas tentativas seguidas — aguarde um momento e tente novamente.'
                : `Não foi possível salvar o PDF: ${saveError && saveError.message ? saveError.message : 'erro desconhecido'}.`;
            renderWarnings([{ level: 'error', message: mensagem }]);
          }
        }
      }
    } catch (error) {
      renderWarnings([{ level: 'error', message: `Não foi possível gerar o PDF: ${error && error.message ? error.message : 'erro desconhecido'}.` }]);
    } finally {
      els.botaoGerar.textContent = textoOriginal;
      updateCheap();
    }
  });

  renderPalettes();
  renderIcons();
  scheduleUpdate();
</script>
